<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1110" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <title>Seata TCC 模式工作流程图</title>
  <desc>基于 Apache Seata 2.x 源码的 TCC (Try-Confirm-Cancel) 分布式事务 TM/RM/TC 协作时序图</desc>

  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1360" height="1110" fill="#f7f9fc"/>

  <!-- phase tints -->
  <rect x="50" y="150" width="1260" height="550" fill="#eef4fb"/>
  <rect x="50" y="702" width="1260" height="348" fill="#fbf3ec"/>

  <!-- title -->
  <text x="680" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f2740">Seata TCC 模式工作流程图</text>
  <text x="680" y="64" text-anchor="middle" font-size="13" fill="#64748b">基于 Apache Seata 2.x 源码 · TM / RM / TC 协作时序 (Try - Confirm - Cancel)</text>

  <!-- lane headers -->
  <g id="headers">
    <rect x="160" y="92" width="220" height="50" rx="8" fill="#3b82f6"/>
    <text x="270" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TM 事务管理器</text>
    <text x="270" y="132" text-anchor="middle" font-size="11" fill="#e0ecff" font-family="'SFMono-Regular',Consolas,monospace">TransactionalTemplate</text>

    <rect x="590" y="92" width="220" height="50" rx="8" fill="#16a34a"/>
    <text x="700" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RM 资源管理器 (TCC)</text>
    <text x="700" y="132" text-anchor="middle" font-size="11" fill="#dcfce7" font-family="'SFMono-Regular',Consolas,monospace">TCCResourceManager</text>

    <rect x="1020" y="92" width="220" height="50" rx="8" fill="#f59e0b"/>
    <text x="1130" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TC 事务协调器 (Server)</text>
    <text x="1130" y="132" text-anchor="middle" font-size="11" fill="#fef3c7" font-family="'SFMono-Regular',Consolas,monospace">DefaultCoordinator</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="270" y1="142" x2="270" y2="1050"/>
    <line x1="700" y1="142" x2="700" y2="1050"/>
    <line x1="1130" y1="142" x2="1130" y2="1050"/>
  </g>

  <!-- phase labels -->
  <rect x="70" y="160" width="170" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="155" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Phase 1 · Try 一阶段</text>

  <line x1="50" y1="701" x2="1310" y2="701" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="70" y="712" width="240" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="190" y="730" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Phase 2 · Confirm / Cancel 二阶段</text>

  <!-- ============ PHASE 1 ============ -->

  <!-- ① TM begin -->
  <g>
    <rect x="160" y="189" width="220" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="270" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">① 开启全局事务</text>
    <text x="270" y="227" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">DefaultGlobalTransaction.begin()</text>
  </g>

  <!-- A: TM -> TC GlobalBeginRequest -->
  <line x1="380" y1="214" x2="1020" y2="214" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="620" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">GlobalBeginRequest</text>

  <!-- ② TC create global session -->
  <g>
    <rect x="1020" y="189" width="220" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1130" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">② 创建全局会话</text>
    <text x="1130" y="227" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">DefaultCore.begin() -> XID</text>
  </g>

  <!-- B: TC -> TM return XID -->
  <line x1="1020" y1="308" x2="380" y2="308" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <text x="620" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">返回 XID</text>

  <!-- ③ TM bind XID -->
  <g>
    <rect x="160" y="283" width="220" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="270" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">③ 绑定事务上下文</text>
    <text x="270" y="321" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">RootContext.bind(xid)</text>
  </g>

  <!-- C: TM -> RM invoke Try -->
  <line x1="380" y1="402" x2="590" y2="402" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="485" y="394" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">调用 TCC Try 方法（RPC 透传 XID）</text>

  <!-- ④ RM intercept -->
  <g>
    <rect x="590" y="377" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="700" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">④ 拦截 Try 方法</text>
    <text x="700" y="415" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">TccActionInterceptorHandler</text>
  </g>

  <!-- D: RM -> TC BranchRegisterRequest -->
  <line x1="810" y1="496" x2="1020" y2="496" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="915" y="488" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">BranchRegisterRequest</text>

  <!-- ⑤ TC register branch -->
  <g>
    <rect x="1020" y="471" width="220" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1130" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">⑤ 注册分支会话</text>
    <text x="1130" y="509" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">AbstractCore.branchRegister()</text>
  </g>

  <!-- E: TC -> RM return branchId -->
  <line x1="1020" y1="586" x2="810" y2="586" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <text x="915" y="578" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">返回 branchId</text>

  <!-- ⑥ RM execute Try -->
  <g>
    <rect x="590" y="561" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="700" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑥ 执行 Try 业务</text>
    <text x="700" y="599" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">prepareFence / targetCallback</text>
  </g>

  <!-- F: RM -> TC BranchReportRequest (optional) -->
  <line x1="810" y1="664" x2="1020" y2="664" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="915" y="656" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#eef4fb" stroke-width="4">BranchReportRequest（可选）</text>

  <!-- ============ PHASE 2 ============ -->

  <!-- ⑦ TM commit/rollback -->
  <g>
    <rect x="160" y="745" width="220" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="270" y="764" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">⑦ 提交 / 回滚</text>
    <text x="270" y="783" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">commit() / rollback()</text>
  </g>

  <!-- G: TM -> TC GlobalCommit/RollbackRequest -->
  <line x1="380" y1="770" x2="1020" y2="770" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="620" y="762" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" paint-order="stroke" stroke="#fbf3ec" stroke-width="4">GlobalCommitRequest / GlobalRollbackRequest</text>

  <!-- ⑧ TC drive phase 2 -->
  <g>
    <rect x="1020" y="745" width="220" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1130" y="764" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">⑧ 驱动二阶段</text>
    <text x="1130" y="783" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">DefaultCore.doGlobalCommit/Rollback()</text>
  </g>

  <!-- H: TC -> RM BranchCommit/RollbackRequest -->
  <line x1="1020" y1="866" x2="810" y2="866" stroke="#475569" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="915" y="850" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#fbf3ec" stroke-width="4">
    <tspan x="915" dy="0">BranchCommit / RollbackRequest</tspan>
    <tspan x="915" dy="15">（逐分支下发）</tspan>
  </text>

  <!-- ⑨ RM handle -->
  <g>
    <rect x="590" y="841" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="700" y="860" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑨ 处理分支请求</text>
    <text x="700" y="879" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">RMHandlerTCC -> TCCResourceManager</text>
  </g>

  <!-- connector ⑨ -> ⑩ -->
  <line x1="700" y1="891" x2="700" y2="917" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="712" y="908" font-size="10.5" fill="#15803d">反射调用</text>

  <!-- ⑩ RM invoke method -->
  <g>
    <rect x="590" y="919" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="700" y="938" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑩ 反射调用业务方法</text>
    <text x="700" y="957" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">commitMethod / rollbackMethod</text>
  </g>

  <!-- I: RM -> TC BranchStatus -->
  <line x1="810" y1="1018" x2="1020" y2="1018" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <text x="915" y="1002" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#fbf3ec" stroke-width="4">
    <tspan x="915" dy="0">BranchStatus</tspan>
    <tspan x="915" dy="15">（Committed / Rollbacked）</tspan>
  </text>

  <!-- ⑪ TC remove branch / retry -->
  <g>
    <rect x="1020" y="993" width="220" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1130" y="1012" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">⑪ 移除分支 / 重试</text>
    <text x="1130" y="1031" text-anchor="middle" font-size="10" fill="#475569" font-family="'SFMono-Regular',Consolas,monospace">SessionHelper.removeBranch()</text>
  </g>

  <!-- legend -->
  <g id="legend">
    <rect x="70" y="1062" width="1220" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="92" y1="1080" x2="128" y2="1080" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>
    <text x="138" y="1084" font-size="11.5" fill="#475569">实线 = 请求 / 调用</text>
    <line x1="300" y1="1080" x2="336" y2="1080" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
    <text x="346" y="1084" font-size="11.5" fill="#475569">虚线 = 响应 / 返回</text>
    <text x="540" y="1084" font-size="11.5" fill="#475569">注解：@TwoPhaseBusinessAction / @LocalTCC   ·   useTCCFence = true 时，Try / Confirm / Cancel 三阶段经 DefaultCommonFenceHandler 提供幂等与防悬挂保护</text>
  </g>
</svg>